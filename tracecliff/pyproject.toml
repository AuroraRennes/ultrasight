[project]
name = "tracecliff"
version = "0.1.0"
description = "CoreSight ETM overflow-sweep CLI: drive cs-trace sweeps and analyze/plot the results"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib", "numpy"]

[project.scripts]
tracecliff = "tracecliff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracecliff"]
